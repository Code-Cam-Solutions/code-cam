<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo-codecam.svg" />
    <!-- O iOS ignora os ícones do manifesto e usa este; sem ele, quem adiciona
         o app à tela de início recebe uma miniatura da página. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!--
      Sem `maximum-scale` nem `user-scalable=no`: bloquear o zoom por pinça
      viola a WCAG 1.4.4 e inviabiliza o uso por quem tem baixa visão — que é
      exatamente o público deste app. `viewport-fit=cover` faz o layout ocupar
      a área sob o notch em aparelhos com recorte de tela.
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

    <!-- A cor da barra do sistema. Antes eram duas metas presas a
         `prefers-color-scheme`, o que amarrava a barra ao aparelho e não à
         escolha feita em Ajustes: quem usava o celular no escuro e pedia tema
         claro continuava com a barra preta. Agora é uma só, ajustada pelo
         script abaixo antes da primeira pintura e mantida pelo app depois. -->
    <meta name="theme-color" id="meta-theme-color" content="#0e0e13" />

    <meta
      name="description"
      content="CodeCam — fotografe seus materiais de estudo e transforme-os em resumos e flashcards acessíveis com IA."
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="CodeCam" />
    <meta property="og:title" content="CodeCam" />
    <meta property="og:description" content="Escaneie, aprenda, evolua." />
    <meta property="og:type" content="website" />

    <title>CodeCam</title>

    <script>
      /**
       * Aplica as preferências de exibição antes da primeira pintura.
       *
       * Se isto rodasse só depois que o React montasse, quem escolheu tema
       * escuro veria um clarão branco a cada carregamento. O script é
       * deliberadamente inline e síncrono: qualquer atraso reintroduz o flash.
       */
      (function () {
        try {
          var saved = JSON.parse(localStorage.getItem("codecam-accessibility") || "{}");
          var root = document.documentElement;

          var theme = saved.theme || "system";
          if (theme === "system") {
            theme = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
          }
          root.dataset.theme = theme;

          if (saved.highContrast) root.dataset.contrast = "high";
          if (saved.openDyslexic) root.dataset.dyslexic = "true";
          root.dataset.fontSize = saved.fontSize || "md";

          // Os mesmos valores de `--ds-bg` dos tokens. Repetidos aqui de
          // propósito: a folha de estilo pode ainda não ter sido analisada
          // quando este script roda, e ler o token devolveria vazio. O app
          // reassume a partir do token assim que monta.
          var barra = { light: "#f7f7fa", dark: "#0e0e13" };
          if (saved.highContrast) barra = { light: "#ffffff", dark: "#000000" };

          var meta = document.getElementById("meta-theme-color");
          if (meta) meta.setAttribute("content", barra[theme]);
        } catch (e) {
          // Preferências ilegíveis: o CSS assume o padrão do sistema sozinho.
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
